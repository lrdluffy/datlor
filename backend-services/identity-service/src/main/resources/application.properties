# ============================================================
# identity-service configuration
# ============================================================
server.port=8081
spring.application.name=identity-service

# ---- Datasource ----
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:identity_db}
spring.datasource.username=${DB_USER:identity_user}
spring.datasource.password=${DB_PASSWORD:identity_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA ----
# Flyway owns the schema; Hibernate must only validate it, never auto-generate DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---- JWT ----
# In production, inject jwt.secret via an environment variable / secret manager (min 256-bit key for HS256).
jwt.secret=${JWT_SECRET:this-is-a-dev-only-secret-key-please-override-in-prod-min-32-bytes}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXP_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXP_MS:604800000}
jwt.issuer=identity-service

# ---- Logging ----
logging.level.org.springframework.security=INFO
logging.level.com.strawhats.identity=DEBUG

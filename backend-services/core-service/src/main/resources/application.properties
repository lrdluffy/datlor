# ============================================================
# core-service configuration (datlor)
# ============================================================
server.port=8082
spring.application.name=core-service

# ---- Datasource ----
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:core_db}
spring.datasource.username=${DB_USER:core_user}
spring.datasource.password=${DB_PASSWORD:core_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA ----
# Flyway owns the schema; Hibernate must only validate it, never auto-generate DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---- JWT ----
# MUST match identity-service's jwt.secret exactly - this service only *validates*
# access tokens issued by identity-service, it never issues its own.
jwt.secret=${JWT_SECRET:this-is-a-dev-only-secret-key-please-override-in-prod-min-32-bytes}
jwt.issuer=identity-service

# ---- Logging ----
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.messaging=INFO
logging.level.com.strawhats.core=DEBUG

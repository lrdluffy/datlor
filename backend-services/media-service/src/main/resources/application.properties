# ============================================================
# media-service configuration (datlor)
# ============================================================
server.port=8083
spring.application.name=media-service

# ---- Datasource ----
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:media_db}
spring.datasource.username=${DB_USER:media_user}
spring.datasource.password=${DB_PASSWORD:media_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---- JWT ----
# MUST match identity-service's jwt.secret exactly - this service only *validates*
# access tokens issued by identity-service, it never issues its own.
jwt.secret=${JWT_SECRET:this-is-a-dev-only-secret-key-please-override-in-prod-min-32-bytes}
jwt.issuer=identity-service

# ---- Storage backend ----
# USE_MINIO=false (default): LocalStorageServiceImpl simulates an object
#   store on local disk under media.storage.root.
# USE_MINIO=true: MinioStorageServiceImpl stores files in the MinIO bucket
#   configured below instead. Both implement the same StorageService
#   interface, so no caller (controller, MediaFileService, core-service,
#   frontend) needs to change either way - see StorageService's javadoc.
media.storage.use-minio=${USE_MINIO:false}
media.storage.public-base-url=${MEDIA_PUBLIC_BASE_URL:http://localhost:8083/api/media}
media.storage.max-file-size-bytes=${MEDIA_MAX_FILE_SIZE_BYTES:26214400}

# ---- Local storage (used when USE_MINIO=false) ----
media.storage.root=${MEDIA_STORAGE_ROOT:${app.home:./}/media}

# ---- MinIO storage (used when USE_MINIO=true) ----
media.storage.minio.endpoint=${MINIO_ENDPOINT:localhost}
media.storage.minio.port=${MINIO_PORT:9000}
media.storage.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
media.storage.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
media.storage.minio.bucket-name=${MINIO_BUCKET_NAME:datlor-media}
media.storage.minio.use-ssl=${MINIO_USE_SSL:false}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ---- Internal service-to-service calls (US-18 mediaId validation) ----
# MUST match the same value core-service is configured with (INTERNAL_API_KEY).
internal-api.key=${INTERNAL_API_KEY:dev-only-internal-key-change-in-production}

# ---- Logging ----
logging.level.com.strawhats.media=DEBUG
